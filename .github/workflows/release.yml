name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: check tag matches mod_version
        run: |
          version=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi

      - run: ./gradlew build

      - name: extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi

      - name: create gh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            build/libs/no_item_break-${GITHUB_REF_NAME#v}.jar
